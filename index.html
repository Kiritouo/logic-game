<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>按鍵邏輯推理遊戲</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; flex-direction: column; align-items: center; background: #f0f2f5; padding: 20px; }
        h2 { color: #333; margin-bottom: 20px; }
        
        .image-container { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-bottom: 30px; max-width: 600px; width: 100%; text-align: center; }
        .logic-image { width: 100%; height: auto; border-radius: 8px; }

        .drag-section { width: 100%; max-width: 500px; background: #fff; padding: 25px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h3 { margin-top: 0; color: #444; }
        
        .drag-item { padding: 12px; margin: 5px; background: #007bff; color: white; border-radius: 6px; cursor: move; text-align: center; display: inline-block; min-width: 90px; transition: transform 0.2s; }
        .drag-item:hover { transform: scale(1.05); background: #0056b3; }
        
        .drop-zone { border: 2px dashed #cbd5e0; padding: 12px; margin: 10px 0; min-height: 50px; border-radius: 10px; display: flex; align-items: center; justify-content: space-between; background: #fafafa; }
        .label { font-weight: bold; width: 100px; color: #555; font-size: 1.1em; }
        
        .button-group { display: flex; gap: 12px; margin-top: 25px; }
        .check-btn { flex: 2; padding: 14px; background: #28a745; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; }
        .reset-btn { flex: 1; padding: 14px; background: #6c757d; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; }
        .check-btn:hover { background: #218838; }
        .reset-btn:hover { background: #5a6268; }
        
        #result { margin-top: 20px; font-weight: bold; font-size: 1.2em; min-height: 24px; text-align: center; }
    </style>
</head>
<body>

    <h2>觀察圖片並配對按鍵功能</h2>
    
    <div class="image-container">
        <!-- 引用圖片 question2.png -->
        <img src="question2.png" alt="按鍵邏輯圖" class="logic-image">
    </div>

    <div class="drag-section">
        <h3>拖曳配對功能</h3>
        
        <!-- 選項池 -->
        <div id="options-pool" class="drop-zone" style="border-style: solid; justify-content: center; background: #f8f9fa;" ondragover="allowDrop(event)" ondrop="drop(event, 'options-pool')">
            <div class="drag-item" draggable="true" id="f-vol-up">提高音量</div>
            <div class="drag-item" draggable="true" id="f-vol-down">降低音量</div>
            <div class="drag-item" draggable="true" id="f-power">開關機</div>
        </div>

        <!-- 放置目標 -->
        <div class="drop-zone" ondragover="allowDrop(event)" ondrop="drop(event, 'ans1')">
            <span class="label">按鈕 [ 1 ]：</span>
            <div id="ans1" style="flex-grow: 1; display: flex; justify-content: center; min-height: 40px;"></div>
        </div>
        <div class="drop-zone" ondragover="allowDrop(event)" ondrop="drop(event, 'ans2')">
            <span class="label">按鈕 [ 2 ]：</span>
            <div id="ans2" style="flex-grow: 1; display: flex; justify-content: center; min-height: 40px;"></div>
        </div>
        <div class="drop-zone" ondragover="allowDrop(event)" ondrop="drop(event, 'ans3')">
            <span class="label">按鈕 [ 3 ]：</span>
            <div id="ans3" style="flex-grow: 1; display: flex; justify-content: center; min-height: 40px;"></div>
        </div>

        <div class="button-group">
            <button class="check-btn" onclick="checkAnswer()">驗證答案</button>
            <button class="reset-btn" onclick="resetGame()">重置</button>
        </div>
        
        <p id="result"></p>
    </div>

    <script>
        function allowDrop(ev) {
            ev.preventDefault();
        }

        function drag(ev) {
            ev.dataTransfer.setData("text", ev.target.id);
        }

        document.querySelectorAll('.drag-item').forEach(item => {
            item.addEventListener('dragstart', drag);
        });

        function drop(ev, targetId) {
            ev.preventDefault();
            const data = ev.dataTransfer.getData("text");
            const draggedElement = document.getElementById(data);
            const dropZone = document.getElementById(targetId);
            
            if (targetId === 'options-pool' || dropZone.children.length === 0) {
                dropZone.appendChild(draggedElement);
            }
        }

        function checkAnswer() {
            const a1 = document.getElementById('ans1').firstElementChild?.id;
            const a2 = document.getElementById('ans2').firstElementChild?.id;
            const a3 = document.getElementById('ans3').firstElementChild?.id;
            const resultTxt = document.getElementById('result');

            // 最終更新後的正確答案：1:提高音量, 2:降低音量, 3:開關機
            if (a1 === 'f-vol-up' && a2 === 'f-vol-down' && a3 === 'f-power') {
                resultTxt.innerText = "🎉 太棒了！這是正確的功能對應！";
                resultTxt.style.color = "#28a745";
            } else {
                resultTxt.innerText = "❌ 答案不太對哦，再檢查看看吧。";
                resultTxt.style.color = "#dc3545";
            }
        }

        function resetGame() {
            const pool = document.getElementById('options-pool');
            const items = document.querySelectorAll('.drag-item');
            items.forEach(item => pool.appendChild(item));
            document.getElementById('result').innerText = "";
        }
    </script>
</body>
</html>
